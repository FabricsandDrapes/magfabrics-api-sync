name: Refresh MAG CSV

on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Generate raw MAG CSV
        run: |
          go run ./cmd/csv-generator-go -apikey "${{ secrets.MAG_API_KEY }}" > magfabrics-raw.csv

      - name: Generate Shopify MAG CSV
        run: |
          go run ./cmd/csv-generator-go -apikey "${{ secrets.MAG_API_KEY }}" -shopify > magfabrics-shopify.csv
          
           - name: Push CSVs to private data repo
        run: |
          git clone https://x-access-token:${{ secrets.DATA_REPO_TOKEN }}@github.com/FabricsandDrapes/mag-data-feed.git data-repo
          cp magfabrics-raw.csv data-repo/magfabrics-raw.csv
          cp magfabrics-shopify.csv data-repo/magfabrics-shopify.csv
          cd data-repo
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add magfabrics-raw.csv magfabrics-shopify.csv
          git commit -m "Update MAG CSV files" || echo "No changes to commit"
          git push
          
      - name: Upload CSV files
        uses: actions/upload-artifact@v4
        with:
          name: magfabrics-csv-files
          path: |
            magfabrics-raw.csv
            magfabrics-shopify.csv
